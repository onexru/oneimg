name: 发布

# 打 v* 标签即触发：编译多平台二进制 + 建 GitHub Release + 推多架构镜像。
# 手动触发（workflow_dispatch）时请填入版本号，例如 v4.0.2。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 v4.0.2）"
        required: true
        type: string
      upx:
        description: "是否用 UPX 压缩可执行文件（体积约 -70%，代价是内存与启动）"
        required: false
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

permissions:
  contents: write

# 同一个版本不并发跑两遍，避免重复建 Release / 重复推同名镜像。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Docker Hub 仓库名。镜像地址为 <DOCKERHUB_USERNAME>/<IMAGE_NAME>。
  IMAGE_NAME: oneimg-oneimg

jobs:
  # 前端只构建一次，产物喂给后面四个编译任务，省掉四份 node_modules。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      # 是否 UPX 压缩。手动触发看输入，标签触发看仓库变量 UPX，都没设则为 false。
      upx: ${{ steps.ver.outputs.upx }}
    steps:
      - name: 解析版本号
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPX: ${{ inputs.upx }}
          VAR_UPX: ${{ vars.UPX }}
        run: |
          set -eu
          V="${INPUT_VERSION:-}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME}"; fi
          case "$V" in
            v*) ;;
            *) V="v$V" ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "发布版本：$V"

          # 标签触发时 inputs.upx 为空，回落到仓库变量；两者都为空即不压缩。
          U="${INPUT_UPX:-${VAR_UPX:-false}}"
          case "$U" in
            true|True|TRUE|1|yes) U="true" ;;
            *) U="false" ;;
          esac
          echo "upx=$U" >> "$GITHUB_OUTPUT"
          echo "UPX 压缩：$U"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 构建前端
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3
          if-no-files-found: error

  # CGO 依赖（libwebp 源码 + go-sqlite3 内置的 SQLite amalgamation）必须真编译，
  # 所以四个目标全用 zig cc 交叉编译，不需要额外的 runner 或系统库。
  binaries:
    needs: prepare
    name: 编译 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            zigtarget: x86_64-linux-musl
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            zigtarget: aarch64-linux-musl
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            zigtarget: x86_64-windows-gnu
            ext: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            zigtarget: aarch64-windows-gnu
            ext: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: 取回前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 编译 ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: zig cc -target ${{ matrix.zigtarget }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X oneimg/backend/config.Version=${VERSION}" \
            -o "oneimg${EXT}" ./main.go
          ls -l "oneimg${EXT}"

      # 可选：UPX 压缩。实测体积降到约 28%，但运行时会把整个二进制解到匿名内存，
      # 常驻内存从约 10 MiB 涨到约 56 MiB、启动多约 1 秒，Windows 还容易被杀软误报。
      # 所以默认关闭，只有仓库变量 UPX=true 或手动触发勾选时才压。
      # 放在「上传镜像用二进制」之前，保证镜像里的可执行文件与 Release 附件一致。
      - name: UPX 压缩
        if: needs.prepare.outputs.upx == 'true'
        env:
          EXT: ${{ matrix.ext }}
        run: |
          set -eu
          VER=5.3.0
          curl -sSL --retry 3 -o upx.tar.xz \
            "https://github.com/upx/upx/releases/download/v${VER}/upx-${VER}-amd64_linux.tar.xz"
          tar -xJf upx.tar.xz
          ./upx-${VER}-amd64_linux/upx --best --lzma -q "oneimg${EXT}"
          ls -l "oneimg${EXT}"

      # 镜像由同一份二进制组装（UPX 开启时同样是压缩后的），单独留一份产物给 docker 任务用。
      - name: 上传镜像用二进制
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: raw-linux-${{ matrix.goarch }}
          path: oneimg
          retention-days: 3
          if-no-files-found: error

      - name: 打包
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -eu
          NAME="oneimg-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "pkg/${NAME}"
          mv "oneimg${EXT}" "pkg/${NAME}/"
          cp -r ca "pkg/${NAME}/" 2>/dev/null || true
          cp .env.example "pkg/${NAME}/" 2>/dev/null || true
          cp README.md "pkg/${NAME}/" 2>/dev/null || true
          cd pkg
          if [ "$ARCHIVE" = "zip" ]; then
            zip -qr "../${NAME}.zip" "${NAME}"
          else
            tar -czf "../${NAME}.tar.gz" "${NAME}"
          fi
          cd ..
          ls -l "${NAME}."*

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            oneimg-*.tar.gz
            oneimg-*.zip
          retention-days: 3
          if-no-files-found: error

  release:
    # 等镜像任务跑完，附件里要带 docker 导出包。
    needs: [prepare, binaries, docker]
    runs-on: ubuntu-latest
    steps:
      # 需要完整标签，才能取到标签注解里手写的更新说明。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          # 只取打包好的发布件，前端产物与镜像用的原始二进制不进 Release。
          pattern: bin-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          # 镜像导出包，随 Release 一起提供离线安装方式。
          pattern: docker-*
          path: artifacts
          merge-multiple: true

      - name: 准备发布说明
        id: notes
        env:
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          # 标签注解写在版本号下一行之后的正文，作为发布说明的正文来源；
          # 注解为空时退回 GitHub 自动生成的改动列表。
          git fetch --force --tags origin "+refs/tags/${TAG}:refs/tags/${TAG}" >/dev/null 2>&1 || true
          BODY="$(git tag -l --format='%(contents:body)' "$TAG" || true)"
          if [ -n "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$BODY" > release-notes.md
            echo "from_tag=true" >> "$GITHUB_OUTPUT"
            echo "使用标签注解作为发布说明（$(wc -l < release-notes.md) 行）"
          else
            echo "from_tag=false" >> "$GITHUB_OUTPUT"
            echo "标签注解为空，改用自动生成的改动列表"
          fi

      - name: 生成校验和
        run: |
          set -eu
          cd artifacts
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 建 Release（标签注解）
        if: steps.notes.outputs.from_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/oneimg-*.tar.gz
            artifacts/oneimg-*.zip
            artifacts/SHA256SUMS.txt

      - name: 建 Release（自动生成说明）
        if: steps.notes.outputs.from_tag == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/oneimg-*.tar.gz
            artifacts/oneimg-*.zip
            artifacts/SHA256SUMS.txt

  docker:
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 组装构建上下文
        run: |
          set -eu
          mkdir -p build-context/linux-amd64 build-context/linux-arm64
          cp Dockerfile.release build-context/Dockerfile
          cp -r ca build-context/ca

      - name: 取回 linux/amd64 二进制
        uses: actions/download-artifact@v4
        with:
          name: raw-linux-amd64
          path: build-context/linux-amd64

      - name: 取回 linux/arm64 二进制
        uses: actions/download-artifact@v4
        with:
          name: raw-linux-arm64
          path: build-context/linux-arm64

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}

      - name: 编译推送（linux/amd64 + linux/arm64）
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: build-context/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关掉 provenance 附带层，避免仓库里出现 unknown/unknown 平台条目。
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub 在部分网络环境不可达，所以再把每个架构的镜像导出成附件放到 Release，
      # 下载后 docker load 即可离线使用。
      # 这里用 buildx 的 docker exporter 直出，而不是 docker pull + save：save 的产物
      # 取决于镜像存储驱动（containerd 会把整个多架构索引一起打包成 OCI 布局），
      # 同一段脚本在不同机器上会导出不同格式与体积，exporter 的产物则是稳定的 docker-archive。
      - name: 导出镜像供 Release 下载
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          TAG="${VERSION#v}"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            OUT="dist/oneimg-${VERSION}-docker-${ARCH}"
            docker buildx build \
              --platform "linux/${ARCH}" \
              --tag "${IMAGE}:${TAG}" \
              --output "type=docker,dest=${OUT}.tar" \
              build-context
            gzip -9 "${OUT}.tar"
            ls -lh "${OUT}.tar.gz"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: docker-archives
          path: dist/*.tar.gz
          retention-days: 3
          if-no-files-found: error
